    <script>
        const prompts = [
            { cat:"AI风格设定", title:"豆包通用硬核问答风格", desc:"全程直白、硬核、不啰嗦的回答风格设定", tags:["豆包","风格"], body:`你必须全程固定采用以下回答风格，永久不可更改、不可弱化、不可客套铺垫：
全程使用最直白、最现实、不兜圈、硬核爽快、不拖沓、扎心不留余地、一语中的、直截了当、直击要害、零铺垫、零客套、零矫情、不绕路、管用、狠、准、稳、干脆、强势、不来虚的；只输出干货、只抓重点、只给结论、只陈述客观事实，只保留核心关键信息。

硬性执行细则：
- 拒绝所有寒暄开场白、安慰式软话、多余过渡句、礼貌缓冲修饰词；上来直接给结论、给干货。
- 剔除所有模棱两可委婉话术，客观问题直接讲本质、讲利弊、讲真相，不美化、不回避问题短板。
- 内容只保留核心关键，砍掉冗余拓展、无关铺垫、大段科普废话，分点只给精炼结论。
- 对错判断直白分明，错误点直接点明，不委婉绕弯；区分客观事实与主观美化描述，只讲真实客观规则。
- 配套之前法律学习全套排版、标号、图标、复制友好规则同步执行，风格硬核精炼 + 结构清晰不冲突。`},

            { cat:"AI风格设定", title:"豆包客观立场问答", desc:"要求AI完全客观回答，不迎合用户", tags:["豆包","客观","风格"], body:`请以完全客观的立场来回答我的问题，不要有任何迎合的倾向。如果我所说的内容存在错误，必须明确且及时地纠正，要依据事实和准确的知识来进行解答。

客观地回应我的每一个问题，不要为了迎合我而给出不准确或片面的答案。若我有错误观点或表述不当之处，务必清晰地指出并说明正确的内容。

以客观、公正、不迎合的态度来回答。对于我所提出的问题，若有错误或不合理的地方，请毫无保留地指出并给予正确的解释和引导。

客观地进行回答，不要因为迎合我而歪曲事实。如果我有错误的认知或表达，要明确纠正并给出合理的依据和解释。`},

            { cat:"法律学习排版", title:"法律学习完整排版提示词", desc:"结构化分层输出+图标+标号+排版规则 完整版", tags:["法律","排版","豆包"], body:`你作为法律学习辅助助手，严格遵守以下所有输出规则，永久生效：

一、全局基础约束
- 全程使用多级结构化分层输出，严格区分一级标题、二级条目、细分小点，禁止大段无分段纯文字堆砌
- 全文大量搭配多元功能图标辅助区分内容模块：定义类📖、正向举例✅、反向错误❌、对比表格📊、重点标注📌、要点升级⬆、易错警示⚠、法条溯源📜、区分对比⚖、实操步骤🗒、记忆口诀🧠、考点标注⭐、逻辑拆解🔍、边界限制🚫、案例拓展📰
- 所有法律概念讲解遵循「定义 → 法条依据 → 正向举例 → 反向踩坑例子 → 对比区分 → 核心考点总结」固定流程，不跳步骤
- 输出语言全程通俗化，剥离晦涩法言法语，专业术语配套大白话解释，兼顾应试理解与实务运用
- 回答仅围绕用户提问的法律知识点展开，不延伸无关闲聊、不冗余铺垫、不添加多余开场白结束语

二、排版标号强制规则
- 禁止纯短横线无序列表，所有分层统一使用有序标号体系：
  一级板块：一、二、三、……
  二级细分：（1）（2）（3）……
  三级细节：1. 2. 3. ……
  四级补充：① ② ③ ……
- 每个标号独占行首，标号与正文之间仅保留一个空格，格式统一、整齐对齐，复制粘贴后标号完整保留
- 同类知识点分组收拢，同层级内容对齐排版，不出现层级混乱、标号混用错乱
- 重点关键词、专有法律名词两侧加【】框选标注，方便快速抓取核心
- 如需表格对比统一用标准Markdown有序表头表格📊

三、案例举例标准化
- 每一个法律分类/要件必须配套双案例：✅合规正确示例 + ❌违规错误反例，缺一不可
- 举例前先标注对应图标，示例内容简短精炼，只贴合当前知识点
- 易混淆概念增加⚖对比举例，易踩坑考点增加⚠警示举例
- 同一大类下多个细分项逐条单独举例，一条对应一个标号
- 举例结尾增加1句📌总结提炼，一句话点明案例对应法条/核心规则

四、复制友好优化
- 全文不使用复杂嵌套折叠语法、特殊隐藏标记、不规则换行符号，纯干净标准Markdown基础语法
- 无多余空行，仅板块之间保留1行分隔空行
- 不适用特殊emoji组合符号、小众特殊字符，全部采用通用标准图标
- 所有标号、分段、表格结构轻量化，粘贴至Word/飞书/备忘录/Notion后格式不崩、序号不消失

五、注意力强化 & 分层逻辑
- 每个板块开头用【板块主题+对应图标】做标题
- 高频考点、考试必背内容前加⭐星级标记，实务高频适用规则前加🗒实务标识
- 出现易混淆成对概念时，自动生成📊对比表格
- 复杂法律构成要件用🔍逻辑拆解分层
- 知识点讲完末尾统一设置🧠速记口诀
- 存在法条原文的知识点，末尾附📜简化法条原文截取`},

            { cat:"法律学习排版", title:"使用标准Markdown有序表头表格", desc:"Markdown表格专用模板", tags:["法律","排版"], body:`如需表格对比统一用标准Markdown有序表头表格📊，表格内条目同样带细分数字标号，杜绝空白无标注表格。

易混淆概念增加⚖对比举例，易踩坑考点增加⚠警示举例，实务场景补充📰真实简化判例举例。`},

            { cat:"专利撰写", title:"基于图纸分析结构和功能", desc:"上传图纸，AI分析具体结构、功能、工作原理", tags:["专利撰写","结构分析"], body:`我需要写一篇专利，名字在上面，帮我根据上面的图片和其他相关材料
帮我分析图中的具体结构、功能、整体的工作原理`},

            { cat:"专利撰写", title:"基于现有技术挖掘技术问题", desc:"在现有设备基础上提出可改进的技术问题", tags:["技术挖掘","TRIZ","创造性"], body:`我需要写一篇专利，名字在上面，帮我根据上面的图片和其他相关材料
我希望在这些材料内容的基础上进行改进，在图片中的设备基础上进行改进，我希望你紧密联系图片中的设备，增加改进一些结构，这些结构可以直接指向某些特殊和具体的技术问题

需要满足中国专利制度的新颖性和创造性，同时我希望能提出相对较为特殊和具体的问题，且该问题可以通过机械结构的方式解决，请结合现有技术来对问题挖掘和分析。设置类似的改进拓展，这些问题的基础改进方案至少是我可以在图纸上画出来的机械结构。

提出的问题不要太普通，能否结合这些问题提出更加具体和更加特殊的问题，另外我需要体现技术方案的创造性，保证这个技术方案机械结构的复杂性和特殊性

这些问题不够特殊和具体，是否可以从专利创造性的角度，挖掘一些更细节的问题，还是需要保证这些问题可以通过机械结构方案解决`},

            { cat:"专利撰写", title:"仅提出技术问题(v1.0)", desc:"只挖掘可实施的技术问题，不要求写申请内容", tags:["技术挖掘"], body:`不需要你写出完整的专利申请内容，我只需要你提出可实施的技术问题，这个技术问题需要基本通过机械结构解决，这些问题过于普通，能否结合这些问题提出更加具体和更加特殊的问题，另外我需要体现技术方案的创造性，保证这个技术方案机械结构的特殊性和创造性

在上述内容的基础上，我需要对上面的装置进行进一步的改进，如何提出一个相对特殊的技术问题，且可以通过机械结构技术方案进行解决，同时技术方案具有专利创造性`},

            { cat:"专利撰写", title:"创造性挖掘+方法发明点(v1.1)", desc:"机械方案基础上添加方法发明点，结合算法和公式", tags:["技术挖掘","方法发明"], body:`我认为创造性不够，机械方案基础上添加方法发明点
帮我对这一部分的内容进行拓展，具体解释如何XXX拓展的内容请紧密联系前面文档中的内容，同时提出的问题，需要相对特殊，能否结合这些问题提出更加具体和更加特殊的问题，另外我需要体现技术方案的创造性，保证这个技术方案特殊性和非显而易见性；必要时，关于XXX需要结合一些算法和公式内容

我想要把这些功能进行融合，变成我这件案子的基础方案，请总结结合这些方案，进行机械结构方向的改造，不要涉及一些算法改进和程序上改进的，保证其具有专利创造性`},

            { cat:"专利撰写", title:"结构功能联动挖掘", desc:"通过结构功能之间的联动挖掘创造性", tags:["联动","创造性"], body:`我们一般通过结构功能之间的联动，在运动过程中实现多个功能，来满足中国专利中的创造性，透镜在调节的过程中，如何实现其他功能，帮我进行挖掘

综合前述的内容，形成一个合理且具有新创性的控制方式和控制逻辑，前提当然是基于机械结构`},

            { cat:"专利撰写", title:"技术方案零件名称自命名", desc:"按照专利自命名规则为结构命名", tags:["命名","权利要求"], body:`我这里需要你帮我对结构进行命名，命名方式要按照专利自命名的规则，名称要考虑非必要技术特征，简洁符合权利要求的名称`},

            { cat:"专利撰写", title:"IPC分类号约束方案设计", desc:"方案设计时考虑IPC分类号", tags:["IPC","分类号"], body:`撰写还需要考虑预审分类号和优审分类号的问题，由于我还需要保证撰写的名称和专利方案落入对应的分类号，因此方案的设计还需要考虑IPC分类号的具体内容，请认真考虑`},

            { cat:"权利要求", title:"权利要求布局(10条)", desc:"列出10条权利要求的布局层次", tags:["权利要求","布局"], body:`以上为该专利的附图标记，专利名称是，一种XXX，我需要写10条权利要求，帮我对10条权利要求进行布局，告诉我每个权利要求写什么

写的更简单一点，重点围绕我一开始提出的方案层次
我要写10条权利要求，帮我列出权利要求布局层次，只用写概述大概每条权利要求写什么就行了，不用写的特别详细，必要的时候用md思维导图`},

            { cat:"权利要求", title:"根据布局写出完整权利要求", desc:"根据布局写出完整权利要求并带标号", tags:["权利要求"], body:`根据布局帮我写出完整的权利要求，中文括号带上标号不要出现空格`},

            { cat:"权利要求", title:"检查权利要求错误", desc:"检查形式错误、公开不充分、创造性不足", tags:["权利要求","检查"], body:`帮我检查错误
1、形式错误

            { cat:"审查答复", title:"本领域技术人员定义引用", desc:"引用审查指南中对本领域技术人员的定义", tags:["审查答复","本领域技术人员"], body:`《专利审查指南》第二部分第四章第2.4节指出"发明是否具备创造性，应当基于所属技术领域的技术人员的知识和能力进行评价。所属技术领域的技术人员，也可称为本领域的技术人员，是指一种假设的"人"，假定他知晓申请日或者优先权日之前发明所属技术领域所有的普通技术知识，能够获知该领域中所有的现有技术，并且具有应用该日期之前常规实验手段的能力，但他不具有创造能力。如果所要解决的技术问题能够促使本领域的技术人员在其他技术领域寻找技术手段，他也应具有从该其他技术领域中获知该申请日或优先权日之前的相关现有技术、普通技术知识和常规实验手段的能力"

审查员在审查意见中提供的技术文献中仅公开了……将……推广到……超越《专利审查指南》所指出的"所属技术领域的技术人员"的能力范畴，因此审查员在第一次审查意见中的上述论述不符合《专利审查指南》的规定。`},

            { cat:"审查答复", title:"不能孤立判断区别特征", desc:"引用审查指南要求整体判断", tags:["审查答复","整体判断"], body:`《专利审查指南》第二部分第四章第3.2.1.1判断方法这一小节记载了"在审查中应当客观分析并确定发明实际解决的技术问题。为此，首先应当分析要求保护的发明与最接近的现有技术相比有哪些区别特征，然后根据该区别特征在要求保护的发明中所能达到的技术效果确定发明实际解决的技术问题""对于功能上彼此相互支持、存在相互作用关系的技术特征，应整体上考虑所述技术特征和它们之间的关系在要求保护的发明中所达到的技术效果"；

根据《专利审查指南》规定的审查原则，区别技术特征所要解决的技术问题需要根据所要求的保护的发明中所能达到的技术效果确定，并且对于功能上彼此相互支持、存在相互作用关系的技术特征需要结合判断其在要求保护的发明中所达到的技术效果，不能孤立的判断；

……是两个彼此相互支持、存在相互作用关系的技术特征，共同解决了……的技术问题。`},

            { cat:"审查答复", title:"带式输送机公知常识反驳示例", desc:"引用词典定义反驳审查员公知常识认定", tags:["审查答复","公知常识"], body:`本领域人员公知的技术知识是"带式输送机是通过输送带运动实现货物连续运输的装卸运输机械。由托辊支承、改向及张紧滚筒将其张紧的输送带，在驱动滚筒藉滚筒与张紧带之间的摩擦力驱动下运动，将输送带上承载的货物运送到卸载地"（《交通大辞典》上海交通大学出版社2005-01）；

结合上述公知常识可以毫无疑问的得出的结论是：对于本领域技术人员来说设置安装结构方便带式输送机的输送带（相当于本申请的输送带41）的运动是本领域技术人员的常规设置，设置安装结构令带式输送机（相当于本申请的输送机构4）进行运动并非是本领域技术人员的常规设置，因此审查员所述设置安装结构以方便输送机构的运动是本领域技术人员的常规设置的论述与实际情况并不相符。`},

            { cat:"专利撰写方法论", title:"专利撰写核心思路(贾哥)", desc:"从技术问题/技术方案/技术效果三方面确定方案", tags:["方法论","撰写思路"], body:`首先，撰写案件的前提需要了解该案件的大致背景，同样撰写案件的顺序，也应当写清背景和技术问题。
重点就是确定技术方案，一般来说，要求最多就是个把小时确定技术方案。

确定技术方案，我们会从三个方面来确定：

1、从技术问题方面考虑
找一个不是很常见的技术问题（就是在我们看来常人一般想不到的技术问题），若解决的技术问题本身具有一定的创造性（比较偏）然后采用现有技术的组合，解决该技术问题，该方案就可以确定。
若该技术问题，自己凭经验判断，感觉不是很常见，但是自己又无法确定，那我们也可以采用现有的技术的组合，不但能解决该技术问题，还能产生额外的效果，解决另外的技术问题；或者，现有技术组合之间彼此有联系或配合（最常见的就是联动），也可以确定技术方案。

2、从技术方案方面考虑
我们找的技术问题比较常见或普通，我们需要从技术方案的方面去考虑，采用现有技术的组合成为一个完整的方案（可实现，无bug），能够解决该技术问题，同时还能够产生额外的效果，该效果不是容易想到就行了。

3、从技术效果方面考虑
我们解决的技术问题比较常见，采用的技术方案也是现有技术的组合，不但能够解决了我们的技术问题，但是我们的技术方案还具有额外的效果（该效果是非显而易见的）；
另外，就是对现有技术跨领域的专用，比如A现有技术在A领域中产生的A效果，此效果在A领域中较为常见，但是没有人在B领域中使用该技术A，B领域和A领域相差较大，此种也可以。

在构思方案的时候，给自己规定时间，比如30分钟（正常普发方案耗时最多不超过一个小时），想不出来，可以采用下述思路：
第一种，该案件不是擅长领域，那就把它转换自己擅长的领域来写。
第二种，组合现有技术，技术点整两三个，效果重叠起来有相互促进、配合、作用和提升等就行。
第三种，找之前案子，过来改，可以是之前已经授权案件，然后进一步改进；或者沿用该授权案件的思路，重新组合现有技术组合方案（最好是不同领域）；或者之前案件还没申请，但是领域区别比较大，也可以拿过来改。
第四种，去找图改，第一种是找现有的图纸，然后对该图进行改进或者组合其它的图，说清楚有益效果。
第五种，找动图修改，理解动作，赋予动作技术效果，或者对动图进行改进或者组合其它动图。

以上种种，都是技术方案为主体，技术问题为前提，技术效果为目的，三者相互对应和转换，其中之一具有创造性即可。

最后，在撰写的时候，我们撰写的说明书要满足26.3的要求，背景技术废话不要太多，清楚明白的说清楚技术问题即可；
技术方案必要特征都要表达出来（其中，在附图当中也是一样，一般来说我们说明书涉及的技术特征，都在要附图中有所体现，不要存在说明书提到了该技术特征，但是在附图中被挡住了，就没有别的图能够看到了，俗称的附图中缺比特），技术方案说完整，清楚，没有原理性错误！
另外，技术方案的扩充和替换等，技术效果的表达都可以穿插在说明书中，但是完整的工作原理应该写明！
技术效果的表达一定要细致到位，技术效果不要概括，小的效果该有的要说清楚，接合或配合的效果也要表达清楚，大的或总的效果也要说明白！这方面是重点！
权利要求撰写，独权应该进行简单上位概括，技术方案完整清楚的表述就行（不要缺比特），从权同样需要完整和清楚；（权利要求不要出现纯粹的功能性限定，以及限定的方案不完整的问题！）。`},

            { cat:"其他", title:"专利提示词参考网站", desc:"外部参考资源", tags:["参考"], body:`专利提示词参考网站：https://patentprompt.com/`}
        ];

        let activeCat = '全部';
        const catOrder = ['全部','专利撰写','专利撰写方法论','权利要求','说明书撰写','审查答复','AI风格设定','法律学习排版','其他'];

        function renderTabs(){
            const tabBar = document.getElementById('tabBar');
            tabBar.innerHTML = catOrder.map(c => {
                const count = c==='全部' ? prompts.length : prompts.filter(p=>p.cat===c).length;
                return `<button class="tab${activeCat===c?' active':''}" onclick="setCat('${c}')">${c} (${count})</button>`;
            }).join('');
        }

        function setCat(cat){ activeCat = cat; renderTabs(); filterPrompts(); }
        function filterPrompts(){
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = prompts.filter(p => {
                const matchCat = activeCat==='全部' || p.cat===activeCat;
                const matchQ = !q || p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.body.toLowerCase().includes(q) || p.tags.some(t=>t.toLowerCase().includes(q));
                return matchCat && matchQ;
            });
            document.getElementById('countBar').textContent = `共 ${filtered.length} 条提示词`;
            document.getElementById('promptList').innerHTML = filtered.length===0
                ? '<div class="empty">😕 没有匹配的提示词，试试其他关键词</div>'
                : filtered.map((p,i) => `
                <div class="prompt-card" id="card${i}">
                    <h3>${p.title}</h3>
                    <p class="desc">${p.desc}</p>
                    <div class="tag-row">${p.tags.map(t=>`<span class="tag-item">${t}</span>`).join('')}</div>
                    <div class="prompt-body" id="body${i}">${escapeHtml(p.body)}</div>
                    <div class="card-actions">
                        <button class="btn-copy" id="btn${i}" onclick="copyPrompt(${i})">📋 复制</button>
                        <button class="btn-expand" onclick="toggleExpand(${i})">展开/折叠</button>
                    </div>
                </div>`).join('');
        }

        function copyPrompt(i){
            const btn = document.getElementById('btn'+i);
            const body = prompts.filter((p,j)=>{
                const matchCat = activeCat==='全部' || p.cat===activeCat;
                return matchCat;
            })[i];
            if(!body) return;
            navigator.clipboard.writeText(body.body).then(()=>{
                btn.textContent='✅ 已复制'; btn.classList.add('copied');
                setTimeout(()=>{btn.textContent='📋 复制'; btn.classList.remove('copied');},1500);
            });
        }

        function toggleExpand(i){
            const el = document.getElementById('body'+i);
            el.classList.toggle('expanded');
        }

        function escapeHtml(text){
            return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        renderTabs();
        filterPrompts();
    </script>
</body>
