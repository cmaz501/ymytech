    <script>
        // ===== 存储系统 =====
        const MAX_BACKUPS = 10;
        const STORAGE_KEY = 'KT_BACKUP_V2';

        function formatTime(date = new Date()) {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const mi = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return `${y}/${m}/${d} ${h}:${mi}:${s}`;
        }

        function saveData() {
            const backups = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            const newBackup = {
                time: formatTime(),
                mapping: document.getElementById('mapping').value,
                workspace: document.getElementById('workspace').value
            };
            backups.unshift(newBackup);
            if (backups.length > MAX_BACKUPS) backups.length = MAX_BACKUPS;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(backups));
            updateBackupList(backups);
        }

        function updateBackupList(backups) {
            const list = document.getElementById('backupList');
            list.innerHTML = backups.map((item, index) => `
                <div class="backup-item">
                    <div class="backup-time">${item.time}</div>
                    <div class="backup-preview" title="${item.workspace}">${item.workspace.replace(/\n/g, ' ').substr(0, 30)}${item.workspace.length > 30 ? '...' : ''}</div>
                    <button class="restore-btn" onclick="restoreBackup(${index})">恢复</button>
                </div>`).join('');
        }

        function restoreBackup(index) {
            const backups = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            const backup = backups[index];
            if (backup && confirm(`确定要恢复 ${backup.time} 的备份吗？`)) {
                document.getElementById('mapping').value = backup.mapping;
                document.getElementById('workspace').value = backup.workspace;
                saveData();
            }
        }

        function manualSave() {
            saveData();
            resetTimer();
            showToast('✅ 已保存到浏览器备份', 'success');
        }

        // 自动保存定时器
        let countdown = 300;
        let timerId;
        function updateTimerDisplay() {
            const m = Math.floor(countdown / 60);
            const s = countdown % 60;
            document.getElementById('countdown').textContent = `${m}:${String(s).padStart(2, '0')}`;
        }
        function startTimer() {
            timerId = setInterval(() => {
                countdown--;
                updateTimerDisplay();
                if (countdown <= 0) { saveData(); resetTimer(); }
            }, 1000);
        }
        function resetTimer() { clearInterval(timerId); countdown = 300; updateTimerDisplay(); startTimer(); }

        // Toast
        let toastTimer = null;
        function showToast(msg, type = 'info') {
            const el = document.getElementById('saveToast');
            el.textContent = msg;
            el.className = 'save-toast ' + type + ' show';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
        }

        // 本地文件保存（同时保存术语映射库 + 撰写工作区）
        let localFileHandle = null;
        function getCombinedContent() {
            const mapping = document.getElementById('mapping').value.trim();
            const workspace = document.getElementById('workspace').value.trim();
            return '========== 术语映射库 ==========\n' + mapping + '\n\n========== 撰写工作区 ==========\n' + workspace;
        }
        async function saveToLocalFile() {
            const content = getCombinedContent();
            if (localFileHandle) {
                if (confirm('📄 是否覆盖上次保存的 "专利文案.txt" 文件？\n\n点击"确定"覆盖，点击"取消"重新选择位置。')) {
                    try {
                        const writable = await localFileHandle.createWritable();
                        await writable.write(content);
                        await writable.close();
                        showToast('✅ 已覆盖保存到 ' + localFileHandle.name, 'success');
                        return;
                    } catch (err) { localFileHandle = null; showToast('⚠️ 文件权限已失效，请重新选择保存位置', 'error'); }
                } else { localFileHandle = null; }
            }
            if (window.showSaveFilePicker) {
                try {
                    const fh = await window.showSaveFilePicker({
                        suggestedName: '专利文案.txt',
                        types: [{ description: '文本文件', accept: { 'text/plain': ['.txt'] } }]
                    });
                    localFileHandle = fh;
                    const w = await fh.createWritable();
                    await w.write(content);
                    await w.close();
                    showToast('✅ 文件已保存 术语映射库+工作区 到 ' + fh.name, 'success');
                } catch (err) {
                    if (err.name === 'AbortError') showToast('ℹ️ 保存已取消', 'info');
                    else fallbackSave(content);
                }
            } else { fallbackSave(content); }
        }
        function fallbackSave(content) {
            try {
                const blob = new Blob([content || getCombinedContent()], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = '专利文案.txt';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showToast('📁 文件已下载（含术语映射库+工作区）', 'info');
                localFileHandle = null;
            } catch (err) { showToast('❌ 保存失败: ' + err.message, 'error'); }
        }

        // 初始化
        window.addEventListener('load', () => {
            const backups = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            updateBackupList(backups);
            startTimer();
            window.addEventListener('beforeunload', () => saveData());
            setInterval(saveData, 300000);
        });
        document.addEventListener('DOMContentLoaded', () => {
            window.addEventListener('keydown', (e) => { if (e.ctrlKey && e.key === 's') { e.preventDefault(); manualSave(); } });
        });
    </script>

    <script>
        // ===== 撰写计时 =====
        const typingAreas = [document.getElementById('mapping'), document.getElementById('workspace')];
        let totalTypingTime = 0, currentStartTime = null, typingTimerId = null, isPageVisible = true;
        function updateTypingTimer() {
            const elapsed = totalTypingTime + (currentStartTime ? Date.now() - currentStartTime : 0);
            const m = Math.floor(elapsed / 60000);
            const s = Math.floor((elapsed % 60000) / 1000);
            document.getElementById('typingTimer').textContent = `${m}:${String(s).padStart(2, '0')}`;
        }
        function startTyping() { if (!currentStartTime && isPageVisible) currentStartTime = Date.now(); if (!typingTimerId) typingTimerId = setInterval(updateTypingTimer, 1000); updateTypingTimer(); }
        function pauseTyping() { if (currentStartTime) { totalTypingTime += Date.now() - currentStartTime; currentStartTime = null; } clearInterval(typingTimerId); typingTimerId = null; updateTypingTimer(); }
        function checkFocus() { (typingAreas.some(a => document.activeElement === a) && isPageVisible) ? startTyping() : pauseTyping(); }
        typingAreas.forEach(a => { a.addEventListener('focus', checkFocus); a.addEventListener('blur', checkFocus); });
        document.addEventListener('visibilitychange', () => { isPageVisible = !document.hidden; checkFocus(); });
    </script>

    <script>
        // ===== 术语统计 =====
        function updateTermStats() {
            const mt = document.getElementById('mapping').value;
            const wt = document.getElementById('workspace').value;
            const lines = mt.split('\n');
            const rl = [];
            for (let line of lines) {
                if (line.trim() === '') { rl.push(''); continue; }
                const items = line.split(/；+/).filter(i => i.trim());
                if (items.length === 0) { rl.push(''); continue; }
                const sl = [];
                for (let item of items) {
                    const [key, value] = (item || '').split(/、/).map(s => s.trim());
                    if (!key || !value) continue;
                    const count = (wt.match(new RegExp(`\\b${key}\\b`, 'g')) || []).length;
                    const status = count > 0 ? '√' : '×';
                    const hs = count > 0 ? 'background-color: yellow;' : '';
                    sl.push(`<span style="${hs}">${value}${key}（${count}次${status}）</span>`);
                }
                rl.push(sl.length > 0 ? sl.join('、') : '');
            }
            document.getElementById('termStats').innerHTML = rl.join('<br>') || '暂无统计数据';
        }

        function checkMappingDuplicates() {
            const mt = document.getElementById('mapping').value;
            const wd = document.getElementById('mappingWarning');
            wd.innerHTML = ''; wd.style.display = 'none';
            const allTerms = mt.split(/；+/).map(item => { const [k, v] = (item || '').split(/、/).map(s => s.trim()); return { key: k, value: v }; }).filter(t => t.key && t.value);
            const ks = new Set(), vs = new Set(), dk = [], dv = [];
            allTerms.forEach(({ key, value }) => {
                if (ks.has(key)) { if (!dk.includes(key)) dk.push(key); } else ks.add(key);
                if (vs.has(value)) { if (!dv.includes(value)) dv.push(value); } else vs.add(value);
            });
            let wm = '';
            if (dk.length) wm += `⚠️ 警告：零件标号重复 - ${dk.join(', ')}。<br>`;
            if (dv.length) wm += `⚠️ 警告：零件名称重复 - ${dv.join(', ')}。`;
            if (wm) { wd.innerHTML = wm; wd.style.display = 'block'; }
        }

        document.getElementById('workspace').addEventListener('input', updateTermStats);
        document.getElementById('mapping').addEventListener('input', () => { updateTermStats(); checkMappingDuplicates(); });
        updateTermStats(); checkMappingDuplicates();
    </script>

    <script>
        // ===== 下拉菜单 & 数字替换 =====
        (() => {
            const mapping = document.getElementById('mapping');
            const workspace = document.getElementById('workspace');
            const dropdown = document.getElementById('dropdown');
            const toggleModeBtn = document.getElementById('toggleModeBtn');
            let isProcessing = false, activeIndex = -1, useBrackets = true;
            const modeText = document.getElementById('modeText');
            toggleModeBtn.addEventListener('click', () => {
                useBrackets = !useBrackets;
                modeText.textContent = useBrackets ? '现在是写权要，带括号，如西蓝花（11），爽的扣胩' : '现在是写说明书，不带括号模式，如西蓝花11，一般小爽';
            });
            const createMapping = () => {
                const map = {};
                mapping.value.split('\n').forEach(line => {
                    line.split(/；+/).filter(i => i.trim()).forEach(item => {
                        const [key, value] = (item || '').split(/、/).map(s => s.trim());
                        if (key && value) map[key] = value;
                    });
                });
                return Object.keys(map).sort((a, b) => b.length - a.length).reduce((acc, key) => (acc[key] = map[key], acc), {});
            };
            const showDropdown = (options, pos) => {
                dropdown.innerHTML = ''; activeIndex = 0;
                options.forEach((opt, i) => { const div = document.createElement('div'); div.className = 'dropdown-item'; div.textContent = opt; div.addEventListener('click', () => insertOption(opt)); if (i === activeIndex) div.classList.add('active'); dropdown.appendChild(div); });
                dropdown.style.left = (pos.x + window.scrollX) + 'px';
                dropdown.style.top = (pos.y + window.scrollY) + 'px';
                dropdown.style.display = 'block';
            };
            const insertOption = (option) => {
                const cp = workspace.selectionStart;
                const pre = workspace.value.slice(0, cp);
                let rl = 0;
                for (let i = pre.length - 1; i >= 0; i--) { if (/\d/.test(pre[i])) rl++; else break; }
                workspace.value = pre.slice(0, cp - rl) + option + workspace.value.slice(cp);
                const np = cp - rl + option.length;
                workspace.setSelectionRange(np, np);
                dropdown.style.display = 'none';
            };
            workspace.addEventListener('input', function(e) {
                if (isProcessing) return;
                isProcessing = true;
                const cp = this.selectionStart;
                const pre = this.value.slice(0, cp);
                let numStr = '';
                for (let i = pre.length - 1; i >= 0; i--) { if (/\d/.test(pre[i])) numStr = pre[i] + numStr; else break; }
                if (numStr) {
                    const mappings = createMapping();
                    const options = Object.keys(mappings).filter(k => k.startsWith(numStr)).map(k => useBrackets ? `${mappings[k]}（${k}）` : `${mappings[k]}${k}`);
                    if (options.length) { const pos = getCursorPosition(workspace); showDropdown(options, pos); } else dropdown.style.display = 'none';
                } else dropdown.style.display = 'none';
                isProcessing = false;
            });
            const getCursorPosition = (input) => {
                const start = input.selectionStart;
                const cs = getComputedStyle(input);
                const div = document.createElement('div');
                for (const p of cs) div.style[p] = cs[p];
                div.style.position = 'absolute'; div.style.left = '-9999px'; div.style.top = '0';
                div.style.overflow = 'auto'; div.style.visibility = 'hidden';
                div.style.whiteSpace = 'pre-wrap'; div.style.wordWrap = 'break-word';
                div.style.width = input.clientWidth + 'px'; div.style.height = input.clientHeight + 'px';
                div.textContent = input.value.substr(0, start);
                if (input.value[start] === '\n') div.appendChild(document.createElement('br'));
                const span = document.createElement('span');
                span.textContent = input.value.substr(start) || '.';
                div.appendChild(span);
                document.body.appendChild(div);
                div.scrollTop = input.scrollTop; div.scrollLeft = input.scrollLeft;
                const dr = div.getBoundingClientRect(), sr = span.getBoundingClientRect();
                document.body.removeChild(div);
                const ir = input.getBoundingClientRect();
                return { x: ir.left + (sr.left - dr.left), y: ir.top + (sr.top - dr.top) + parseFloat(cs.fontSize) };
            };
            workspace.addEventListener('keydown', function(e) {
                if (dropdown.style.display === 'block') {
                    const items = dropdown.querySelectorAll('.dropdown-item');
                    switch (e.key) {
                        case 'ArrowDown': activeIndex = (activeIndex + 1) % items.length; break;
                        case 'ArrowUp': activeIndex = (activeIndex - 1 + items.length) % items.length; break;
                        case ' ': case 'Enter':
                            if (activeIndex >= 0) { insertOption(items[activeIndex].textContent); e.preventDefault(); } break;
                    }
                    items.forEach((it, i) => it.classList.toggle('active', i === activeIndex));
                }
            });
            workspace.addEventListener('scroll', () => { if (dropdown.style.display === 'block') dropdown.style.display = 'none'; });
            workspace.addEventListener('blur', () => setTimeout(() => { dropdown.style.display = 'none'; }, 100));
        })();
    </script>

    <script>
        function changeTheme(theme) { document.body.className = theme; }
        function changeFont(ff) {
            document.body.style.fontFamily = ff;
            document.querySelectorAll('textarea').forEach(t => t.style.fontFamily = ff);
            const s = document.getElementById('termStats'); if (s) s.style.fontFamily = ff;
            const t = document.getElementById('saveToast'); if (t) t.style.fontFamily = ff;
            localStorage.setItem('KT_USER_FONT', ff);
        }
        document.addEventListener('DOMContentLoaded', () => {
            const sf = localStorage.getItem('KT_USER_FONT');
            if (sf) {
                document.body.style.fontFamily = sf;
                document.querySelectorAll('textarea').forEach(t => t.style.fontFamily = sf);
                const s = document.getElementById('termStats'); if (s) s.style.fontFamily = sf;
                const t = document.getElementById('saveToast'); if (t) t.style.fontFamily = sf;
                const fs = document.getElementById('fontSelect');
                if (fs) { for (let o of fs.options) { if (o.value === sf) { o.selected = true; break; } } }
            }
        });
    </script>
