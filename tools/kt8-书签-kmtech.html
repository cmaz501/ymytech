<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精选书签 KT8 - 开迈科技 kamaytech</title>
<style>
:root { --primary:#7c3aed; --primary-light:#8b5cf6; --accent:#10b981; --bg:#f8f9fa; --text:#1f2937; --text2:#6b7280; --border:#e5e7eb; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.8; font-size:15px; }
a { text-decoration:none; }

/* Nav */
.navbar { position:sticky; top:0; z-index:1000; background:rgba(255,255,255,0.92); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 48px; }
.nav-inner { max-width:1500px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:72px; }
.nav-logo { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--text); }
.nav-logo-icon { width:44px; height:44px; background:linear-gradient(135deg,var(--primary),var(--primary-light)); border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; font-weight:700; }
.nav-logo-text { font-size:22px; font-weight:700; background:linear-gradient(135deg,var(--primary),var(--primary-light)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.nav-links { display:flex; gap:36px; list-style:none; align-items:center; }
.nav-links a { text-decoration:none; color:var(--text2); font-size:16px; font-weight:500; transition:color 0.2s; position:relative; }
.nav-links a:hover,.nav-links a.active { color:var(--primary); }
.nav-links a.active::after { content:''; position:absolute; bottom:-6px; left:0; right:0; height:2px; background:var(--primary); border-radius:2px; }

/* Header */
.page-header { max-width:1500px; margin:0 auto; padding:32px 48px 0; text-align:center; }
.page-header h2 { font-size:28px; font-weight:700; }
.page-header p { color:var(--text2); font-size:15px; margin-top:8px; }

/* Toolbar */
.toolbar { max-width:1500px; margin:24px auto 0; padding:0 48px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
.view-tabs { display:flex; gap:4px; background:#fff; border:1px solid var(--border); border-radius:10px; padding:4px; }
.view-tab { padding:8px 18px; border-radius:8px; border:none; background:transparent; cursor:pointer; font-size:14px; font-weight:500; color:var(--text2); transition:all 0.2s; }
.view-tab:hover { color:var(--primary); background:rgba(124,58,237,0.05); }
.view-tab.active { background:var(--primary); color:#fff; }
.search-wrap { position:relative; }
.search-wrap input { padding:10px 16px; border:1px solid var(--border); border-radius:10px; font-size:14px; outline:none; width:280px; transition:border-color 0.2s; background:#fff; }
.search-wrap input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(124,58,237,0.1); }

/* Content */
.content { max-width:1500px; margin:20px auto; padding:0 48px 80px; }
.cat-section { margin-bottom:32px; }
.cat-head { font-size:20px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:2px solid var(--primary); }
.cat-head .count { font-size:14px; color:var(--text2); font-weight:400; }

/* ===== Card Grid View ===== */
.card-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:16px; }
.c-card { background:#fff; border-radius:14px; padding:22px 24px; border:1px solid var(--border); transition:all 0.2s; display:flex; gap:14px; align-items:flex-start; }
.c-card:hover { box-shadow:0 6px 24px rgba(0,0,0,0.07); border-color:var(--primary); transform:translateY(-2px); }
.c-icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
.c-icon.blue { background:rgba(59,130,246,0.1); color:#3b82f6; }
.c-icon.green { background:rgba(16,185,129,0.1); color:#10b981; }
.c-icon.orange { background:rgba(249,115,22,0.1); color:#f97316; }
.c-icon.purple { background:rgba(124,58,237,0.1); color:#7c3aed; }
.c-icon.teal { background:rgba(20,184,166,0.1); color:#14b8a6; }
.c-info { flex:1; min-width:0; }
.c-info h4 { font-size:15px; font-weight:600; color:var(--text); margin-bottom:4px; }
.c-info .c-url { font-size:12px; color:#9ca3af; word-break:break-all; margin-bottom:6px; }
.c-info .c-desc { font-size:13px; color:var(--text2); line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.c-badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:4px; font-weight:500; margin-top:2px; }
.c-badge.gov { background:rgba(59,130,246,0.1); color:#2563eb; }
.c-badge.search { background:rgba(16,185,129,0.1); color:#059669; }

/* ===== List View ===== */
.list-view { display:flex; flex-direction:column; gap:4px; }
.l-item { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:10px; transition:all 0.15s; border:1px solid transparent; }
.l-item:hover { background:#fff; border-color:var(--border); box-shadow:0 2px 8px rgba(0,0,0,0.04); }
.l-icon { font-size:20px; width:28px; text-align:center; flex-shrink:0; }
.l-name { font-size:14px; font-weight:600; color:var(--text); min-width:160px; }
.l-url { font-size:12px; color:#9ca3af; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.l-desc { font-size:13px; color:var(--text2); display:none; }
.l-badge { font-size:11px; padding:2px 8px; border-radius:4px; font-weight:500; flex-shrink:0; }
.l-badge.gov { background:rgba(59,130,246,0.1); color:#2563eb; }
.l-badge.search { background:rgba(16,185,129,0.1); color:#059669; }

/* ===== Table View ===== */
.table-wrap { background:#fff; border-radius:12px; border:1px solid var(--border); overflow:hidden; }
.table-wrap table { width:100%; border-collapse:collapse; }
.table-wrap th { background:#f5f3ff; color:var(--primary); font-weight:600; font-size:14px; padding:14px 18px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
.table-wrap td { padding:12px 18px; border-bottom:1px solid #f3f4f6; font-size:14px; vertical-align:top; }
.table-wrap tr:last-child td { border-bottom:none; }
.table-wrap tr:hover td { background:#faf5ff; }
.table-wrap .t-name { font-weight:600; color:var(--text); white-space:nowrap; }
.table-wrap .t-url a { color:var(--primary); word-break:break-all; }
.table-wrap .t-url a:hover { text-decoration:underline; }
.table-wrap .t-desc { color:var(--text2); font-size:13px; }
.t-badge { font-size:11px; padding:2px 8px; border-radius:4px; font-weight:500; white-space:nowrap; }
.t-badge.gov { background:rgba(59,130,246,0.1); color:#2563eb; }
.t-badge.search { background:rgba(16,185,129,0.1); color:#059669; }

.hidden { display:none !important; }
.empty-msg { text-align:center; padding:60px 20px; color:var(--text2); font-size:16px; }

/* Footer */
.footer { background:#1f2937; color:#d1d5db; padding:48px 48px 40px; text-align:center; margin-top:60px; }
.footer-inner { max-width:1500px; margin:0 auto; }
.footer-brand { font-size:22px; font-weight:700; color:#fff; margin-bottom:8px; }
.footer-slogan { color:#9ca3af; font-size:14px; margin-bottom:24px; }
.footer-divider { border:none; border-top:1px solid #374151; margin:24px 0; }
.footer-copy { font-size:14px; color:#6b7280; }

@media (max-width:768px) {
  .navbar { padding:0 20px; } .nav-links { gap:16px; } .nav-links a { font-size:13px; }
  .content { padding:0 20px 60px; } .toolbar { padding:0 20px; flex-direction:column; align-items:stretch; }
  .search-wrap input { width:100%; }
  .card-grid { grid-template-columns:1fr; }
  .l-name { min-width:100px; } .l-url { display:none; }
  .table-wrap { overflow-x:auto; }
}
</style>
</head>

<div class="page-header">

</div>

<div class="toolbar">
  <div class="view-tabs">
    <button class="view-tab active" onclick="switchView('card',this)">📇 卡片</button>
    <button class="view-tab" onclick="switchView('list',this)">📋 列表</button>
    <button class="view-tab" onclick="switchView('table',this)">📊 表格</button>
  </div>
  <div class="search-wrap"><input type="text" id="searchInput" placeholder="🔍 搜索名称 / URL / 描述..." oninput="renderAll()"></div>
</div>

<hr class="footer-divider"><div class="footer-copy">© 2025 开迈科技 kamaytech by cmaz501</div>
</div></footer>

<script>
const DATA = [
  // 国知局/官方
  { cat:"国知局/官方", icon:"🏛️", color:"blue", badge:"gov", name:"国家知识产权局", url:"https://www.cnipa.gov.cn", desc:"国知局官网，政策法规、办事指南、公告通知" },
  { cat:"国知局/官方", icon:"🏛️", color:"blue", badge:"gov", name:"专利复审和无效", url:"https://www.cnipa.gov.cn/col/col2632/index.html", desc:"复审委员会，复审请求、无效宣告、口审公告" },
  { cat:"国知局/官方", icon:"🏛️", color:"blue", badge:"gov", name:"公共服务平台", url:"https://ggfw-sso.cnipa.gov.cn", desc:"统一身份认证，一站式访问各业务系统" },
  { cat:"国知局/官方", icon:"🏛️", color:"blue", badge:"gov", name:"多国专利审查信息查询", url:"https://cpquery.cponline.cnipa.gov.cn", desc:"查案卷状态、审查意见、费用信息，支持中英查询" },
  { cat:"国知局/官方", icon:"🏛️", color:"blue", badge:"gov", name:"中国专利公布公告", url:"http://epub.cnipa.gov.cn", desc:"已公开专利全文、著录项目、法律状态查询" },
  { cat:"国知局/官方", icon:"🏛️", color:"blue", badge:"gov", name:"专利代理管理系统", url:"https://dlgl.cnipa.gov.cn", desc:"代理机构及代理师备案、变更、考核管理" },
  { cat:"国知局/官方", icon:"🏛️", color:"blue", badge:"gov", name:"代理机构查询", url:"https://ggfw.cnipa.gov.cn/poam/txnqueryAgencyOrg.do", desc:"全国专利代理机构信息检索" },
  { cat:"国知局/官方", icon:"🏛️", color:"blue", badge:"gov", name:"代理人查询", url:"https://ggfw.cnipa.gov.cn/poam/txnqueryAgent.do", desc:"全国专利代理师执业信息检索" },
  { cat:"国知局/官方", icon:"🏛️", color:"blue", badge:"gov", name:"专利代理师考试系统", url:"https://ggfw-dlsks.cnipa.gov.cn", desc:"资格证考试报名、准考证、成绩查询" },
  { cat:"国知局/官方", icon:"🏛️", color:"blue", badge:"gov", name:"IPC分类查询", url:"https://www.cnipa.gov.cn/col/col200/index.html", desc:"国际专利分类(IPC)查询，按分类号定位技术领域" },
  { cat:"国知局/官方", icon:"🏛️", color:"blue", badge:"gov", name:"专利业务办理系统", url:"https://cponline.cnipa.gov.cn", desc:"在线提交专利申请、中间文件、缴费办理" },
  { cat:"国知局/官方", icon:"🏛️", color:"blue", badge:"gov", name:"优先权文件交换(DAS)", url:"https://das.cnipa.gov.cn", desc:"优先权文件数字接入服务，电子交换证明文件" },

  // 专利检索/数据库
  { cat:"专利检索/数据库", icon:"🔍", color:"green", badge:"search", name:"Google Patents", url:"https://patents.google.com", desc:"全球专利全文检索，机器翻译覆盖100+国家/地区" },
  { cat:"专利检索/数据库", icon:"🔍", color:"green", badge:"search", name:"Espacenet 欧专局", url:"https://worldwide.espacenet.com", desc:"欧洲专利局全球数据库，100+国家专利文献" },
  { cat:"专利检索/数据库", icon:"🔍", color:"green", badge:"search", name:"WIPO Patentscope", url:"https://patentscope.wipo.int", desc:"WIPO全球专利检索，PCT申请全文查询" },
  { cat:"专利检索/数据库", icon:"🔍", color:"green", badge:"search", name:"Patentics 智能语义", url:"https://www.patentics.com", desc:"AI语义专利检索分析，概念检索与分类导航" },
  { cat:"专利检索/数据库", icon:"🔍", color:"green", badge:"search", name:"佰腾网", url:"https://www.baiten.cn", desc:"国内平台，简单检索/高级检索/语义检索" },
  { cat:"专利检索/数据库", icon:"🔍", color:"green", badge:"search", name:"SooPAT", url:"http://www.soopat.com", desc:"免费专利检索分析，中文语义检索与图表分析" },
  { cat:"专利检索/数据库", icon:"🔍", color:"green", badge:"search", name:"专利之星", url:"http://www.patentstar.com.cn", desc:"专利检索与管理系统，分类号导航检索" },
  { cat:"专利检索/数据库", icon:"🔍", color:"green", badge:"search", name:"智慧芽 PatSnap", url:"https://analytics.zhihuiya.com", desc:"全球情报分析平台，AI辅助、3D专利地图" },
  { cat:"专利检索/数据库", icon:"🔍", color:"green", badge:"search", name:"HimmPat", url:"https://www.himmpat.com", desc:"高效专利检索分析平台，智能分类筛选" },
  { cat:"专利检索/数据库", icon:"🔍", color:"green", badge:"search", name:"IPTOP 管家", url:"https://iptop.lotut.com", desc:"综合知产服务平台，专利/商标一站式查询" },
  { cat:"专利检索/数据库", icon:"🔍", color:"green", badge:"search", name:"极笔 patentfuture", url:"https://patentfuture.com", desc:"新一代专利检索与撰写辅助平台" },
  { cat:"专利检索/数据库", icon:"🔍", color:"green", badge:"search", name:"汉信AI（原重乎）", url:"https://www.hanxinai.com", desc:"AI专利查重与检索，筛查低质量专利" },
  { cat:"专利检索/数据库", icon:"🔍", color:"green", badge:"search", name:"专利查重重乎网", url:"https://www.chonghus.com", desc:"AI驱动专利查重，文本相似度对比分析" }
];

let currentView = 'card';

function switchView(v, btn) {
  currentView = v;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  // hide all views, show target
  document.querySelectorAll('.view-card,.view-list,.view-table').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.view-'+v).forEach(el => el.classList.remove('hidden'));
}

function renderAll() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  const container = document.getElementById('content');
  const cats = ['国知局/官方','专利检索/数据库'];
  let html = '';
  let totalItems = 0;

  cats.forEach(cat => {
    let items = DATA.filter(d => d.cat === cat);
    if (q) items = items.filter(d => d.name.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) || d.url.toLowerCase().includes(q));
    if (items.length === 0) return;
    totalItems += items.length;

    html += `<div class="cat-section">
      <div class="cat-head">${items[0].icon} ${cat} <span class="count">（${items.length}个）</span></div>`;

    // Card Grid
    html += `<div class="view-card${currentView==='card'?'':' hidden'}"><div class="card-grid">`;
    items.forEach(d => {
      html += `<a href="${d.url}" target="_blank" rel="noopener" class="c-card">
        <div class="c-icon ${d.color}">${d.icon}</div>
        <div class="c-info"><h4>${d.name} <span class="c-badge ${d.badge}">${d.badge.toUpperCase()}</span></h4>
        <div class="c-url">${d.url}</div><div class="c-desc">${d.desc}</div></div></a>`;
    });
    html += `</div></div>`;

    // List
    html += `<div class="view-list${currentView==='list'?'':' hidden'}"><div class="list-view">`;
    items.forEach(d => {
      html += `<a href="${d.url}" target="_blank" rel="noopener" class="l-item">
        <span class="l-icon">${d.icon}</span>
        <span class="l-name">${d.name}</span>
        <span class="l-url">${d.url}</span>
        <span class="l-badge ${d.badge}">${d.badge.toUpperCase()}</span></a>`;
    });
    html += `</div></div>`;

    // Table
    html += `<div class="view-table${currentView==='table'?'':' hidden'}"><div class="table-wrap"><table>
      <thead><tr><th style="width:180px">名称</th><th>URL</th><th>说明</th><th style="width:70px">标签</th></tr></thead><tbody>`;
    items.forEach(d => {
      html += `<tr><td class="t-name">${d.icon} ${d.name}</td>
        <td class="t-url"><a href="${d.url}" target="_blank" rel="noopener">${d.url}</a></td>
        <td class="t-desc">${d.desc}</td>
        <td><span class="t-badge ${d.badge}">${d.badge.toUpperCase()}</span></td></tr>`;
    });
    html += `</tbody></table></div></div>`;

    html += `</div>`; // cat-section
  });

  if (totalItems === 0) {
    container.innerHTML = '<div class="empty-msg">😕 没有找到匹配的网站</div>';
  } else {
    container.innerHTML = html;
  }
}

// Init
renderAll();
</script>
</body>
</html>
