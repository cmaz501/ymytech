let activeCat = '全部';

function renderBookmarks(filtered) {
    const container = document.getElementById('bookmarkList');
    if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:80px 20px;color:var(--text-secondary);font-size:16px;">😕 没有找到匹配的网站</div>';
        return;
    }
    const cats = activeCat === '全部'
        ? ['官方/国知局','检索/数据库','协会/行业','法律/法规','工具/辅助','国际/海外']
        : [activeCat];
    let html = '';
    cats.forEach(cat => {
        const items = filtered.filter(b => b.cat === cat);
        if (items.length === 0) return;
        html += `<div class="cat-section">
            <div class="cat-title">${items[0].icon} ${cat} <span class="count">（${items.length}个）</span></div>
            <div class="bookmark-grid">`;
        items.forEach(b => {
            html += `<a href="${b.url}" target="_blank" rel="noopener" class="bookmark-card">
                <div class="bookmark-icon ${b.color}">${b.icon}</div>
                <div class="bookmark-info">
                    <h4>${b.title} <span class="bookmark-badge ${b.badge}">${b.badge.toUpperCase()}</span></h4>
                    <div class="url">${b.url}</div>
                    <div class="desc">${b.desc}</div>
                </div>
            </a>`;
        });
        html += '</div></div>';
    });
    container.innerHTML = html;
}

function setCat(cat) {
    activeCat = cat;
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    filterBookmarks();
}

function filterBookmarks() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    let filtered = bookmarks;
    if (activeCat !== '全部') {
        filtered = filtered.filter(b => b.cat === activeCat);
    }
    if (q) {
        filtered = filtered.filter(b =>
            b.title.toLowerCase().includes(q) ||
            b.url.toLowerCase().includes(q) ||
            b.desc.toLowerCase().includes(q) ||
            b.cat.toLowerCase().includes(q)
        );
    }
    renderBookmarks(filtered);
}

renderBookmarks(bookmarks);
</script>
